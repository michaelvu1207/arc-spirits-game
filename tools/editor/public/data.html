<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data · Niji Batch</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0b0f; --panel: #12141a; --card: #171a21; --line: #23262f; --line-2: #30343f; --text: #e6e7eb; --dim: #9a9eab; --faint: #646978; --seg: #20232b; --field: #0d0e13; --accent: #f0532d; --ok: #4ecb8f; --bad: #f0616d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Figtree", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  [hidden] { display: none !important; }
  .split { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); }
  main.games > :not(#gamesFrame) { display: none !important; } #gamesFrame { display: none; width: 100%; height: 100vh; border: 0; background: var(--bg); } main.games > #gamesFrame { display: block; }
  .split:has(main.games) { grid-template-rows: minmax(0, 1fr); } .split:has(main.games) aside { overflow-y: auto; } #gamesFrame { height: 100%; }
  @media (max-height: 840px) { aside .note { display: none; } }
  aside header { padding: 14px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  aside header a { color: var(--dim); text-decoration: none; font-weight: 500; font-size: 13px; } aside header a:hover { color: var(--text); }
  .tabs { padding: 8px; } .tabs button { display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; color: var(--dim); } .tabs button.on { background: var(--seg); color: var(--text); }
  .chead img { width: 112px !important; height: 112px !important; padding: 10px; background: #d9cfb8; border-radius: 8px !important; }
  .chead .newicon { display: grid; justify-items: center; gap: 2px; padding-left: 8px; border-left: 1px solid var(--line); } .chead .newicon small { font-size: 10px; color: var(--accent); }
  .tabs small { color: var(--faint); margin-left: 6px; }
  .tabs .sub { padding-left: 24px; font-size: 13px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 600; } .spacer { flex: 1; } .status { color: var(--dim); font-size: 13px; }
  .tb { padding: 7px 14px; border-radius: 8px; background: var(--seg); font-weight: 500; font-size: 13px; white-space: nowrap; } .tb.go { background: var(--accent); color: #180802; } .tb:disabled { opacity: .5; cursor: default; }
  .scroll { overflow: auto; padding: 0 16px 24px; }
  table { border-collapse: collapse; width: 100%; }
  th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 500; color: var(--dim); font-size: 12px; padding: 10px 8px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.changed td:first-child { box-shadow: inset 3px 0 var(--accent); }
  input, select, textarea { background: var(--field); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 7px; font-size: 13px; }
  input.num { width: 58px; text-align: center; } input.name { width: 100%; min-width: 180px; } select { padding: 4px 4px; }
  textarea { width: 100%; min-width: 300px; min-height: 52px; resize: vertical; font-size: 12.5px; line-height: 1.4; }
  .track { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 260px; }
  .tok { position: relative; width: 36px; height: 36px; border-radius: 8px; background: var(--seg); display: grid; place-items: center; border: 1px solid var(--line-2); }
  .tok img { width: 28px; height: 28px; object-fit: contain; }
  .tok button { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; line-height: 1; display: none; }
  .tok:hover button { display: grid; place-items: center; }
  .add { width: 36px; height: 36px; border-radius: 8px; border: 1px dashed var(--line-2); color: var(--dim); font-size: 18px; display: grid; place-items: center; }
  .pick { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: repeat(8, 40px); gap: 4px; max-height: 320px; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .pick button { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; } .pick button:hover { background: var(--seg); } .pick img { width: 30px; height: 30px; object-fit: contain; }
  .del { color: var(--faint); font-size: 12px; } .del:hover { color: var(--bad); }
  .effects { display: grid; gap: 4px; min-width: 360px; } .effect { display: flex; gap: 6px; align-items: flex-start; } .effect input { width: 50px; text-align: center; } .effect textarea { min-height: 34px; min-width: 0; flex: 1; }
  .effect .del { padding-top: 6px; }
  .note { color: var(--faint); font-size: 12px; padding: 12px 0; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 0 2px; font-size: 12.5px; color: var(--dim); } .summary b { color: var(--text); font-weight: 600; }
  .pw { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; } .pw small { font-weight: 500; color: var(--dim); margin-left: 5px; }
  .jackpot { color: #f5c542; } .strong { color: var(--ok); } .average { color: var(--dim); } .weak { color: #e9a06b; } .trap { color: var(--bad); }
  tr.inset td { background: rgba(240, 83, 45, .06); } tr.spacer td { height: 26px; border-bottom: 0; background: none; } .setname { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: currentColor; margin-right: 5px; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--dim); } td.v.val { color: var(--text); }
  .curve { display: flex; gap: 14px; align-items: center; padding: 12px 0; color: var(--dim); font-size: 13px; } .curve input { width: 64px; text-align: center; }
  .tname { display: flex; align-items: center; gap: 8px; } .tname .tok { width: 30px; height: 30px; } .tname .tok img { width: 24px; height: 24px; }
  /* classes: cards like the Svelte data editor */
  .divider { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #d4a843; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(168,130,50,.3); }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; padding-top: 12px; }
  .ccard { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; border: 1px solid rgba(168,130,50,.3); border-left: 4px solid var(--cc, rgba(168,130,50,.55));
    background: linear-gradient(135deg, rgba(48,32,20,.82), rgba(62,42,26,.78) 50%, rgba(40,28,18,.82)); box-shadow: inset 0 0 12px rgba(90,62,28,.2), 0 1px 3px rgba(0,0,0,.3); color: #e8d5a0; }
  .ccard.human { border-color: rgba(245,245,245,.34); border-left-color: rgba(245,245,245,.72); background: linear-gradient(135deg, rgba(30,30,34,.9), rgba(44,44,50,.85)); color: #e4e4e7; }
  .ccard.special { border-left-width: 1px; border-color: color-mix(in srgb, var(--cc, #d4a843) 55%, transparent); background: linear-gradient(135deg, rgba(28,18,34,.9), rgba(40,26,46,.85)); }
  .ccard.special::before, .ccard.special::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--cc, #d4a843); }
  .ccard.special::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; } .ccard.special::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
  .ccard.changed { outline: 1px solid var(--accent); }
  .chead { display: flex; align-items: center; gap: 8px; }
  .chead img, .chead .emoji { width: 32px; height: 32px; border-radius: 4px; object-fit: contain; display: grid; place-items: center; font-size: 20px; }
  .chead h2 { margin: 0; font-size: 15px; font-weight: 600; color: #f0dca0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .ccard.human h2 { color: #f8fafc; }
  .chead small { display: block; color: #c4a96a; font-size: 11px; }
  .badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(202,168,62,.25); color: #d4a843; letter-spacing: .04em; }
  .badge.human { background: rgba(245,245,245,.14); border: 1px solid rgba(245,245,245,.28); color: #f8fafc; }
  .cdesc { margin: 0; font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; } .cdesc.empty { color: #a08968; font-style: italic; }
  .ctags { display: flex; gap: 6px; flex-wrap: wrap; } .ctags span { font-size: 11px; color: #e8d5a0; opacity: .8; }
  .bps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .bps li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; background: rgba(25,16,10,.55); border: 1px solid rgba(168,130,50,.25); font-size: 12.5px; }
  .bps .cnt { color: #d4a843; font-weight: 600; white-space: nowrap; } .bps .cnt.bronze { color: #fbbf24; } .bps .cnt.silver { color: #cbd5f5; } .bps .cnt.gold { color: #facc15; }
  .bps .fx { display: grid; gap: 2px; color: #f0dca0; }
  .cfoot { border-top: 1px solid rgba(168,130,50,.3); padding-top: 6px; font-size: 11.5px; color: #d4a843; }
  .cact { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; opacity: 0; } .ccard:hover .cact, .ccard.edit .cact { opacity: 1; } .cact button { font-size: 12px; color: #c4a96a; } .cact button:hover { color: #fff; }
  .ccard input, .ccard textarea, .ccard select { background: rgba(0,0,0,.35); border-color: rgba(168,130,50,.35); color: inherit; }
  .ccard .fx textarea { min-width: 0; min-height: 30px; width: 100%; } .ccard .bps li input { width: 44px; text-align: center; padding: 2px 4px; }
  .ccard h2 input { font-size: 15px; font-weight: 600; width: 100%; } .ccard .cdesc textarea { width: 100%; min-width: 0; }
</style>
</head>
<body>
<div class="split">
  <aside>
    <header><a href="/">← Folders</a><span>Data</span></header>
    <div class="tabs" id="tabs"></div>
    <div class="tabs"><a href="/team.html" style="display:block;padding:8px 10px;border-radius:8px;color:var(--dim);text-decoration:none">Team builder</a><a href="/team.html?sim" style="display:block;padding:8px 10px;border-radius:8px;color:var(--dim);text-decoration:none">Team simulator</a><a data-game="/play" target="_blank" style="display:block;padding:8px 10px;border-radius:8px;color:var(--dim);text-decoration:none">Play the game ↗</a><button id="gamesTab">Games</button></div>
    <script>{const l=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);const b=(l?'http://127.0.0.1':'https://'+location.hostname)+':5317';document.querySelectorAll('a[data-game]').forEach(a=>a.href=b+a.dataset.game);
      // Games: the game app's explorer (trends, games, leaderboard, players) fills the content area.
      const tab=document.getElementById('gamesTab');let frame=null;
      const show=(on)=>{const main=document.querySelector('main');if(on&&!frame){frame=document.createElement('iframe');frame.id='gamesFrame';frame.title='Games';frame.src=b+'/explorer';main.append(frame)}
        main.classList.toggle('games',on);tab.classList.toggle('on',on);if(on)for(const x of document.getElementById('tabs').children)x.classList.remove('on');
        history.replaceState(null,'',on?'#games':location.pathname+location.search)};
      tab.addEventListener('click',()=>show(true));
      document.getElementById('tabs').addEventListener('click',(e)=>{if(e.target.closest('[data-t]')&&frame)show(false)},true);
      addEventListener('DOMContentLoaded',()=>{if(location.hash==='#games')show(true)})}</script>
    <div class="note" style="padding:12px 16px">Local copy of the game data (<code>game/*.json</code>). Save writes the file; the old one stays as <code>.bak.json</code>. Classes 1–3 are the old difficulty tiers; Difficulty 1–15 is the fight cost.</div>
  </aside>
  <main>
    <div class="bar"><h1 id="title">Monsters</h1><span class="status" id="status"></span><span class="spacer"></span><button class="tb" id="addRow">Add row</button><button class="tb go" id="save" disabled>Save</button></div>
    <div class="scroll" id="scroll"></div>
  </main>
</div>
<div class="pick" id="pick" hidden></div>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const file = (p) => '/ws/file?path=' + encodeURIComponent(p);
// A small WebP copy for the screen (the server makes and keeps it). `file` stays the full image, for canvases and exports.
const small = (p, w = 128) => '/ws/file?w=' + w + '&path=' + encodeURIComponent(p);
const get = (p) => fetch(p).then((r) => r.json());
const post = (p, b) => fetch(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }).then((r) => r.json());
const uuid = () => crypto.randomUUID();

let table = 'monsters_v2', stage = 0, rows = [], saved = '', pool = [], poolById = {}, poolIcon = {};
const TITLE = { monsters_v2: 'Monsters', classes: 'Classes', origins: 'Origins', runes: 'Runes', relics: 'Relics', augments: 'Augments', reward_sets: 'Sets', rewards: 'Rewards' };
let RV = { curve: { a: 1, b: 0.4 }, bands: { jackpot: .5, strong: .2, weak: -.2, trap: -.5 }, values: {}, used: {} };
const BANDS = ['jackpot', 'strong', 'average', 'weak', 'trap'];
const THEMES = ['Fire', 'Forest', 'Mountain', 'Water', 'Arcane'];
const expected = (d) => RV.curve.a + RV.curve.b * (Number(d) || 0);
const trackValue = (track) => (track ?? []).reduce((a, id) => a + (RV.values[id] ?? 0), 0);
const bandOf = (p) => p >= RV.bands.jackpot ? 'jackpot' : p >= RV.bands.strong ? 'strong' : p <= RV.bands.trap ? 'trap' : p <= RV.bands.weak ? 'weak' : 'average';
const pct = (p) => (p >= 0 ? '+' : '−') + Math.round(Math.abs(p) * 100) + '%';
const fmt = (v) => (Math.round(v * 100) / 100).toString();
const titleText = () => (TITLE[table] ?? table) + (stage ? table === 'classes' ? ` · ${['', 'Generic', 'Special'][stage]}` : ` · Class ${stage}` : '');
let ICONS = [], SETS = [];
// Fixed backgrounds (Michael, 2026-11-07): runes = the teal shape, relics = the golden shape, augments = the white hexagon. Never per row.
const BG = { runes: 'references/icons/rune_backgrounds/rune.png', relics: 'references/icons/rune_backgrounds/relic.png', augments: 'references/icons/rune_backgrounds/augment.png' };
let curveDirty = false;
const dirty = () => curveDirty || JSON.stringify(rows) !== saved;
const mark = () => { $('save').disabled = !dirty(); $('status').textContent = dirty() ? 'Unsaved changes' : ''; };

async function init() {
  pool = await get('/api/game/icons'); ICONS = (await get('/api/ws/list?path=' + encodeURIComponent('references/icons/classes'))).images ?? []; NEWICONS = (await get('/api/ws/list?path=' + encodeURIComponent('references/icons/classes_new'))).images ?? [];
  for (const t of pool) { poolById[t.id] = t; poolIcon[t.id] = t.icon; }
  SETS = await get('/api/game/table?name=reward_sets').catch(() => []);
  const tabs = await get('/api/game/tables');
  $('tabs').innerHTML = tabs.map((t) => `<button class="${t.name === table && !stage ? 'on' : ''}" data-t="${t.name}">${TITLE[t.name] ?? t.name}<small>${t.rows}</small></button>${t.name === 'monsters_v2' ? [1, 2, 3].map((d) => `<button class="sub" data-t="monsters_v2" data-stage="${d}">Class ${d}</button>`).join('') : ''}${t.name === 'classes' ? `<button class="sub" data-t="classes" data-stage="1">Generic</button><button class="sub" data-t="classes" data-stage="2">Special</button>` : ''}`).join('') + `<button data-t="rewards">Rewards<small>VP values</small></button>`;
  load();
}
async function load() {
  RV = await get('/api/game/rewards');
  if (table === 'reward_sets') { const ms = await get('/api/game/table?name=monsters_v2'); MEMBERS = {}; for (const m of ms) if (m.set) (MEMBERS[m.set] ??= []).push(m.name); }
  if (table === 'rewards') { rows = pool.filter((t) => RV.values[t.id] != null || RV.used[t.id]).map((t) => ({ id: t.id, name: t.name, icon: t.icon, value: RV.values[t.id] ?? 0 })).sort((a, b) => b.value - a.value || a.name.localeCompare(b.name)); }
  else rows = await get('/api/game/table?name=' + table);
  if (table === 'origins') { const [icons, runes, relics] = await Promise.all([get('/api/game/origin-icons'), get('/api/game/table?name=runes'), get('/api/game/table?name=relics')]); ORIGIN = { icons, runes, relics }; }
  saved = JSON.stringify(rows);
  $('title').textContent = TITLE[table] ?? table;
  for (const b of $('tabs').children) b.classList.toggle('on', !document.querySelector('main.games') && b.dataset.t === table && Number(b.dataset.stage ?? 0) === stage);
  $('title').textContent = titleText();
  paint(); mark();
}
// ---------- monsters: name, difficulty, health, damage, reward track ----------
const tok = (id, ri, ti) => `<span class="tok" title="${esc(poolById[id]?.name ?? id)} · ${fmt(RV.values[id] ?? 0)} VP">${poolIcon[id] ? `<img src="${small(poolIcon[id])}" alt="">` : '?'}<button data-rm="${ri}:${ti}" title="Remove">×</button></span>`;
function paintMonsters() {
  // Symmetric sets first (by class, difficulty, set, land), then an empty row, then the random section by difficulty.
  const shown = [...rows.keys()].filter((i) => !stage || rows[i].stage === stage);
  const byDiff = (a, b) => rows[a].stage - rows[b].stage || (rows[a].sub_difficulty ?? 0) - (rows[b].sub_difficulty ?? 0) || rows[a].order_num - rows[b].order_num;
  const setIdx = shown.filter((i) => rows[i].set).sort((a, b) => rows[a].stage - rows[b].stage || (rows[a].sub_difficulty ?? 0) - (rows[b].sub_difficulty ?? 0) || rows[a].set.localeCompare(rows[b].set) || THEMES.indexOf(rows[a].theme) - THEMES.indexOf(rows[b].theme));
  const randIdx = shown.filter((i) => !rows[i].set).sort(byDiff);
  const order = [...setIdx, ...randIdx];
  const stats = order.map((i) => { const m = rows[i], v = trackValue(m.reward_track), e = expected(m.sub_difficulty), p = e ? (v - e) / e : 0; return { v, e, p, band: bandOf(p) }; });
  const SPACER = '<tr class="spacer"><td colspan="12"></td></tr>';
  const count = Object.fromEntries(BANDS.map((b) => [b, stats.filter((x) => x.band === b).length]));
  const mean = stats.length ? stats.reduce((a, x) => a + x.p, 0) / stats.length : 0;
  const nSet = order.filter((i) => rows[i].set).length;
  const summary = `<div class="summary"><span>${stage ? `Class ${stage}` : 'All classes'}: <b>${order.length}</b> monsters</span><span><b>${nSet}</b> in symmetric sets, <b>${order.length - nSet}</b> random</span>${BANDS.map((b) => `<span class="${b}"><span class="dot"></span>${count[b]} ${b}</span>`).join('')}<span>mean power <b>${pct(mean)}</b></span><span>expected = ${fmt(RV.curve.a)} + ${fmt(RV.curve.b)} × difficulty</span></div>`;
  return summary + `<table><thead><tr><th>Name</th>${stage ? '' : '<th>Class</th>'}<th title="Fight cost inside the class: 1–3, 4–8, 9–15">Difficulty</th><th title="The land the monster comes from; runes and relics on its track match it">Theme</th><th title="Symmetric set: four monsters, one per land, same stats and track">Set</th><th>Health</th><th>Damage</th><th>Reward track</th><th title="Sum of the reward values (VP)">Reward value</th><th title="Expected value for this difficulty">Expected</th><th title="(value − expected) / expected">Power</th><th></th></tr></thead><tbody>${order.map((i, k) => { const m = rows[i], st = stats[k]; return `${k === setIdx.length && setIdx.length && randIdx.length ? SPACER : ''}<tr data-i="${i}" class="${m.set ? 'inset' : ''}">
    <td><input class="name" data-f="name" value="${esc(m.name)}"></td>
    ${stage ? '' : `<td><select data-f="stage" data-num>${[1, 2, 3].map((s) => `<option value="${s}" ${m.stage === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td>`}
    <td><input class="num" type="number" min="1" max="15" data-f="sub_difficulty" data-num value="${m.sub_difficulty ?? ''}"></td>
    <td><select data-f="theme">${THEMES.map((t) => `<option ${m.theme === t ? 'selected' : ''}>${t}</option>`).join('')}${m.theme && !THEMES.includes(m.theme) ? `<option selected>${esc(m.theme)}</option>` : ''}</select></td>
    <td><span class="setname">${esc(SETS.find((x) => x.id === m.set)?.name ?? '')}</span></td>
    <td><input class="num" type="number" min="1" data-f="barrier" data-num value="${m.barrier}"></td>
    <td><input class="num" type="number" min="0" data-f="damage" data-num value="${m.damage}"></td>
    <td><div class="track">${(m.reward_track ?? []).map((id, ti) => tok(id, i, ti)).join('')}<button class="add" data-add="${i}" title="Add a reward">+</button></div></td>
    <td class="v val">${fmt(st.v)}</td><td class="v">${fmt(st.e)}</td><td><span class="pw ${st.band}">${pct(st.p)}<small>${st.band}</small></span></td>
    <td><button class="del" data-del="${i}">Remove</button></td></tr>`; }).join('')}</tbody></table>`;
}
// ---------- classes: name, type, summary, effects (count + text) ----------
const isGeneric = (c) => c.class_type === 'normal';
const typeOf = (c) => ['normal', 'human', 'special'].includes(c.class_type) ? c.class_type : c.is_special ? 'special' : 'normal';
const editing = new Set(); // ids of the cards in edit mode
