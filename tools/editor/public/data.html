<style>
  :root { --bg: #0a0b0f; --panel: #12141a; --card: #171a21; --line: #23262f; --line-2: #30343f; --text: #e6e7eb; --dim: #9a9eab; --faint: #646978; --seg: #20232b; --field: #0d0e13; --accent: #f0532d; --ok: #4ecb8f; --bad: #f0616d; }

    background: linear-gradient(135deg, rgba(48,32,20,.82), rgba(62,42,26,.78) 50%, rgba(40,28,18,.82)); box-shadow: inset 0 0 12px rgba(90,62,28,.2), 0 1px 3px rgba(0,0,0,.3); color: #e8d5a0; }

  /* balance: spirit tiers and the monster stats the tests use (read only) */

  /* game explorer: a full-window view. One line per player (points by round); the chosen point's details fill the panel on the right. */

<script type="module">

const small = (p, w = 128) => '/ws/file?w=' + w + '&path=' + encodeURIComponent(p);
const get = (p) => fetch(p).then((r) => r.json());

let table = 'monsters_v2', stage = 0, rows = [], saved = '', pool = [], poolById = {}, poolIcon = {};
const TITLE = { bal_lines: 'Game explorer', bal_spirits: 'Spirit tiers', bal_monsters: 'Monsters in the tests', monsters_v2: 'Monsters', classes: 'Classes', origins: 'Origins', runes: 'Runes', relics: 'Relics', augments: 'Augments', reward_sets: 'Sets', rewards: 'Rewards' };
let RV = { curve: { a: 1, b: 0.4 }, bands: { jackpot: .5, strong: .2, weak: -.2, trap: -.5 }, values: {}, used: {} };
const BANDS = ['jackpot', 'strong', 'average', 'weak', 'trap'];
const THEMES = ['Fire', 'Forest', 'Mountain', 'Water', 'Arcane'];
const expected = (d) => RV.curve.a + RV.curve.b * (Number(d) || 0);
const trackValue = (track) => (track ?? []).reduce((a, id) => a + (RV.values[id] ?? 0), 0);
const bandOf = (p) => p >= RV.bands.jackpot ? 'jackpot' : p >= RV.bands.strong ? 'strong' : p <= RV.bands.trap ? 'trap' : p <= RV.bands.weak ? 'weak' : 'average';
const pct = (p) => (p >= 0 ? '+' : '−') + Math.round(Math.abs(p) * 100) + '%';
const fmt = (v) => (Math.round(v * 100) / 100).toString();
const POOLS = ['', 'Spirit World', 'Arcane Abyss', 'Heroes'];
const isBal = () => table.startsWith('bal_');

let ICONS = [], SETS = [];

const BG = { runes: 'references/icons/rune_backgrounds/rune.png', relics: 'references/icons/rune_backgrounds/relic.png', augments: 'references/icons/rune_backgrounds/augment.png' };
let curveDirty = false;
const dirty = () => curveDirty || JSON.stringify(rows) !== saved;

async function init() {
  pool = await get('/api/game/icons'); ICONS = (await get('/api/ws/list?path=' + encodeURIComponent('references/icons/classes'))).images ?? []; NEWICONS = (await get('/api/ws/list?path=' + encodeURIComponent('references/icons/classes_new'))).images ?? [];
  for (const t of pool) { poolById[t.id] = t; poolIcon[t.id] = t.icon; }

async function load() {

  $('title').textContent = TITLE[table] ?? table;

}
// ---------- monsters: name, difficulty, health, damage, reward track ----------
const tok = (id, ri, ti) => `<span class="tok" title="${esc(poolById[id]?.name ?? id)} · ${fmt(RV.values[id] ?? 0)} VP">${poolIcon[id] ? `<img src="${small(poolIcon[id])}" alt="">` : '?'}<button data-rm="${ri}:${ti}" title="Remove">×</button></span>`;
function paintMonsters() {
  // Symmetric sets first (by class, difficulty, set, land), then an empty row, then the random section by difficulty.
  const shown = [...rows.keys()].filter((i) => !stage || rows[i].stage === stage);
  const byDiff = (a, b) => rows[a].stage - rows[b].stage || (rows[a].sub_difficulty ?? 0) - (rows[b].sub_difficulty ?? 0) || rows[a].order_num - rows[b].order_num;
  const setIdx = shown.filter((i) => rows[i].set).sort((a, b) => rows[a].stage - rows[b].stage || (rows[a].sub_difficulty ?? 0) - (rows[b].sub_difficulty ?? 0) || rows[a].set.localeCompare(rows[b].set) || THEMES.indexOf(rows[a].theme) - THEMES.indexOf(rows[b].theme));
  const randIdx = shown.filter((i) => !rows[i].set).sort(byDiff);
  const order = [...setIdx, ...randIdx];
  const stats = order.map((i) => { const m = rows[i], v = trackValue(m.reward_track), e = expected(m.sub_difficulty), p = e ? (v - e) / e : 0; return { v, e, p, band: bandOf(p) }; });
  const SPACER = '<tr class="spacer"><td colspan="12"></td></tr>';
  const count = Object.fromEntries(BANDS.map((b) => [b, stats.filter((x) => x.band === b).length]));
  const mean = stats.length ? stats.reduce((a, x) => a + x.p, 0) / stats.length : 0;
  const nSet = order.filter((i) => rows[i].set).length;
  const summary = `<div class="summary"><span>${stage ? `Class ${stage}` : 'All classes'}: <b>${order.length}</b> monsters</span><span><b>${nSet}</b> in symmetric sets, <b>${order.length - nSet}</b> random</span>${BANDS.map((b) => `<span class="${b}"><span class="dot"></span>${count[b]} ${b}</span>`).join('')}<span>mean power <b>${pct(mean)}</b></span><span>expected = ${fmt(RV.curve.a)} + ${fmt(RV.curve.b)} × difficulty</span></div>`;
  return summary + `<table><thead><tr><th>Name</th>${stage ? '' : '<th>Class</th>'}<th title="Fight cost inside the class: 1–3, 4–8, 9–15">Difficulty</th><th title="The land the monster comes from; runes and relics on its track match it">Theme</th><th title="Symmetric set: four monsters, one per land, same stats and track">Set</th><th>Health</th><th>Damage</th><th>Reward track</th><th title="Sum of the reward values (VP)">Reward value</th><th title="Expected value for this difficulty">Expected</th><th title="(value − expected) / expected">Power</th><th></th></tr></thead><tbody>${order.map((i, k) => { const m = rows[i], st = stats[k]; return `${k === setIdx.length && setIdx.length && randIdx.length ? SPACER : ''}<tr data-i="${i}" class="${m.set ? 'inset' : ''}">
    <td><input class="name" data-f="name" value="${esc(m.name)}"></td>
    ${stage ? '' : `<td><select data-f="stage" data-num>${[1, 2, 3].map((s) => `<option value="${s}" ${m.stage === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td>`}

    <td class="v val">${fmt(st.v)}</td><td class="v">${fmt(st.e)}</td><td><span class="pw ${st.band}">${pct(st.p)}<small>${st.band}</small></span></td>

}
// ---------- classes: name, type, summary, effects (count + text) ----------
const isGeneric = (c) => c.class_type === 'normal';
const typeOf = (c) => ['normal', 'human', 'special'].includes(c.class_type) ? c.class_type : c.is_special ? 'special' : 'normal';

const num = (v) => (typeof v === 'number' ? v : /^\d+$/.test(String(v).trim()) ? Number(v) : null);
const byCount = (a, b) => { const x = num(a.count), y = num(b.count); return x != null && y != null ? x - y : x != null ? -1 : y != null ? 1 : 0; };
// Icon file from the one-time import, by class name.
let NEWICONS = []; // the icons before the change (references/icons/classes_old), shown next to the current one for review

function card(i) {

    ? `<h2><input data-f="name" value="${esc(c.name)}"></h2><small><select data-f="class_type">${['normal', 'special', 'human'].map((x) => `<option ${t === x ? 'selected' : ''}>${x}</option>`).join('')}</select> · position <input class="num" style="width:50px" type="number" data-f="position" data-num value="${c.position ?? 0}"></small>`
    : `<h2>${esc(c.name)}${t !== 'normal' ? `<span class="badge ${t}">${t === 'human' ? 'Human' : 'Special'}</span>` : ''}</h2><small>Position ${c.position ?? '–'}</small>`;
  const desc = g || edit ? (edit ? `<p class="cdesc"><textarea data-f="description" placeholder="Summary">${esc(c.description)}</textarea></p>` : `<p class="cdesc ${c.description ? '' : 'empty'}">${esc(c.description || 'No description provided.')}</p>`) : '';
  const list = bps.length ? `<ul class="bps">${bps.map(({ bp, ei }) => `<li>${g ? `<span class="cnt ${bp.color ?? ''}">${edit ? `(<input data-ef="${i}:${ei}:count" value="${esc(bp.count)}">)` : `(${esc(bp.count)})`}</span>` : ''}<div class="fx">${edit ? `<textarea data-ef="${i}:${ei}:text">${esc((bp.effects ?? []).map((x) => x.description).join('\n'))}</textarea>` : (bp.effects ?? []).map((x) => `<span>${esc(x.description)}</span>`).join('')}</div>${edit && g ? `<button class="del" data-efdel="${i}:${ei}">×</button>` : ''}</li>`).join('')}</ul>` : `<p class="cdesc empty">No effects configured.</p>`;
  const add = edit && (g || !bps.length) ? `<button class="del" data-efadd="${i}">${g ? '+ breakpoint' : '+ effect'}</button>` : '';

  return `<article class="ccard ${t} ${edit ? 'edit' : ''}" data-i="${i}" style="--cc:${esc(c.color ?? '#d4a843')}">

    <div class="chead">${icon ? `<img src="${small('references/icons/classes/' + icon, 256)}" alt="">` : `<span class="emoji">${esc(c.icon_emoji || '🛡️')}</span>`}${NEWICONS.includes(c.name + '.png') ? `<span class="newicon" title="Proposed new icon (not in use)"><img src="${small('references/icons/classes_new/' + c.name + '.png', 256)}" alt=""><small>new</small></span>` : ''}<div>${head}</div></div>
    ${desc}${tags}${list}${add}${foot}</article>`;
}
function paintClasses() {
  const show = (c) => !stage || (stage === 1) === isGeneric(c);

// ---------- rewards: one subjective value (VP) per token, and the expected-value curve ----------
function paintRewards() {
  const curve = `<div class="curve">Expected value = <input class="num" type="number" step="0.1" data-curve="a" value="${RV.curve.a}"> + <input class="num" type="number" step="0.05" data-curve="b" value="${RV.curve.b}"> × difficulty <span>· bands: jackpot ≥ +${RV.bands.jackpot * 100}%, strong ≥ +${RV.bands.strong * 100}%, weak ≤ ${RV.bands.weak * 100}%, trap ≤ ${RV.bands.trap * 100}%</span></div>`;
  return curve + `<table><thead><tr><th>Reward</th><th>Value (VP)</th><th>On tracks</th><th></th></tr></thead><tbody>${rows.map((t, i) => `<tr data-i="${i}">

// ---------- origins: each origin with its icons (origin icon, its rune, its relic) ----------
let ORIGIN = { icons: {}, runes: [], relics: [] };
function paintOrigins() {

    <td><div class="track"><span class="tok">${ORIGIN.icons[o.name] ? `<img src="${small(ORIGIN.icons[o.name])}" alt="">` : esc(o.icon_emoji ?? '?')}</span></div></td>

  if (table === 'rewards') { openPick($('addRow'), (id) => { if (!rows.some((r) => r.id === id)) rows.unshift({ id, name: poolById[id].name, icon: poolIcon[id], value: 0 }); }); return; }
  if (table === 'reward_sets') { rows.push({ id: 'set-' + uuid().slice(0, 8), name: 'New set', stage: 1, sub_difficulty: 2, barrier: 1, damage: 2, template: ['victory_point', '{rune}'] }); paint(); mark(); return; }
  if (table === 'augments') { rows.push({ id: uuid(), name: 'New augment', class: '', icon: null, source_icon: null, source_emoji: '', description: '' }); paint(); mark(); $('scroll').scrollTop = $('scroll').scrollHeight; return; }
  if (table === 'relics') { rows.push({ id: uuid(), name: 'New relic', owner: '', icon: null, source_icon: null, source_emoji: '', ability: '', description: '' }); paint(); mark(); $('scroll').scrollTop = $('scroll').scrollHeight; return; }
  if (table === 'origins') { rows.push({ id: uuid(), name: 'New origin', position: rows.length + 1, icon_emoji: '', color: '#888888', description: '' }); paint(); mark(); $('scroll').scrollTop = $('scroll').scrollHeight; return; }
  if (table === 'runes') { rows.push({ id: uuid(), name: 'New rune', kind: 'basic', owner: '', icon: null, source_icon: null, source_emoji: '', description: '' }); paint(); mark(); $('scroll').scrollTop = $('scroll').scrollHeight; return; }
  rows.push(table === 'monsters_v2' ? { id: uuid(), name: 'New monster', stage: stage || 1, sub_difficulty: [0, 1, 4, 9][stage || 1], theme: stage === 3 ? 'Arcane' : 'Fire', barrier: 1, damage: 1, order_num: rows.length + 1, reward_track: [], dice_pool: [], attack_type: 'damage', choose_amount: 0, name_translations: {}, card_image_path: null, card_image_path_translations: {} }
    : { id: uuid(), name: 'New class', class_type: stage === 1 ? 'normal' : 'special', description: '', footer: '', tags: [], effect_schema: [{ count: stage === 1 ? 2 : 1, effects: [{ type: 'benefit', description: '' }] }], is_special: stage !== 1, position: rows.length + 1, icon_emoji: '', color: '#8b5cf6' });
  if (table === 'classes') editing.add(rows.at(-1).id);
  paint(); mark(); $('scroll').scrollTop = $('scroll').scrollHeight;
};
$('save').onclick = async () => {
  if (table === 'monsters_v2') for (const m of rows) m.choose_amount = (m.reward_track ?? []).length;
  const r = table === 'rewards' ? await post('/api/game/rewards', { curve: RV.curve, bands: RV.bands, values: Object.fromEntries(rows.map((t) => [t.id, Number(t.value) || 0])) }) : await post('/api/game/table', { name: table, rows });
  if (r.error) return ($('status').textContent = r.error);
  if (table === 'reward_sets') SETS = rows.map((x) => ({ ...x }));
  if (table === 'rewards') { RV.values = Object.fromEntries(rows.map((t) => [t.id, Number(t.value) || 0])); curveDirty = false; }
  saved = JSON.stringify(rows); for (const tr of document.querySelectorAll('tr.changed')) tr.classList.remove('changed'); mark(); $('status').textContent = `Saved ${r.rows ?? r.tokens} rows`;
};
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (!b) return; const same = b.dataset.t === table; if (!same && dirty() && !confirm('Leave without saving?')) return; if (!same) curveDirty = false; stage = Number(b.dataset.stage ?? 0); if (same) { for (const x of $('tabs').children) x.classList.toggle('on', x === b); $('title').textContent = titleText(); paint(); } else { table = b.dataset.t; load(); } history.replaceState(null, '', table === 'bal_lines' ? '#explorer' : location.pathname + location.search); });
addEventListener('beforeunload', (e) => { if (dirty()) e.preventDefault(); });
if (location.hash === '#explorer') table = 'bal_lines';
init();
window.__dbg = () => ({ rows, composeIcon, post }); // for tests
